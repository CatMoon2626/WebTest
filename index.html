<style>
    /* ページ全体 */
    body {
        margin: 0;
        padding-bottom: 140px;
        font-family: Arial, sans-serif;
        background-color: #f5f5f5;
        color: #333;
    }

    /* header */
    header {
        background-color: #6633FF;
        color: white;
        text-align: center;
        padding: 30px 20px;
    }

    header h1 {
        margin: 0;
    }

    /* main */
    main {
        max-width: 800px;
        margin: 40px auto;
        padding: 0 20px;
        color: #0033CC;
    }

    section {
        background-color: white;
        margin-bottom: 30px;
        padding: 25px;
        border-radius: 10px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    h2 {
        margin-top: 0;
        border-left: 5px solid #0033CC;
        padding-left: 10px;
    }

    /* footer */
    footer {
        position: fixed;
        bottom: 0;
        left: 0;
        width: 100%;
        box-sizing: border-box;
        background-color: #DCC2FF;
        color: #FFFF00;
        text-align: center;
        padding: 15px 20px;
    }

    footer p {
        margin: 5px 0;
    }

    /* SNSリンク */
    .social-links {
        margin: 10px 0;
    }

    .social-links a {
        color: #FFFF33;
        text-decoration: none;
        margin: 0 10px;
    }

    .social-links a:hover {
        text-decoration: underline;
    }

    /* コピーライト */
    .copyright {
        font-size: 12px;
    }
</style>
